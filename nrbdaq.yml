# NB: local absolute or relative path for data on disk
root: ~/Documents/nrbdaq

logging:
# NB: specify file relative to root
  file: nrbdaq.log
  level_console: INFO
  # level_console: DEBUG
  level_file: ERROR
  # level_file: WARNING

# data path
data: data

# staging area for transfer, relative to root
staging: staging

s3:
    endpoint_url: 'https://servicedevt.meteoswiss.ch/'
    aws_s3_bucket_name: 'ch.meteoswiss.gawkenya'
    aws_region: 'eu-central-1'
    aws_access_key_id: 'gawkenya_native'
    aws_secret_access_key: ~/.aws/minio-devt-secret-key
    default_prefix: nrb

sftp:
# NB: specify local_source relative to root
  host: sftp.meteoswiss.ch
  usr: gaw_kenya
  key: ~/.ssh/private-open-ssh-4096-mkn.ppk
  remote_path: './nrb'
  proxy:
      socks5:             # proxy url (leave empty if no proxy is used)
      port: 1080

# /dev/ttyUSB0:
#     protocol: RS232     # don't change!
#     baudrate: 9600
#     bytesize: 8
#     stopbits: 1
#     parity: N
#     timeout: 1

/dev/ttyUSB1:
    protocol: RS485     # don't change!
    baudrate: 19200
    bytesize: 8
    stopbits: 1
    parity: N
    timeout: 1

# /dev/ttyUSB2:
#     protocol: RS232     # don't change!
#     baudrate: 9600
#     bytesize: 8
#     stopbits: 1
#     parity: N
#     timeout: 1


AE31:
# NB: Configure AE31 to use the default settings (9600, 8, 1, N).
# NB: [serial_timeout] seconds
# NB: [sampling_interval] minutes
# NB: [reporting_interval] minutes
# NB: specify data, staging, archive relative to root
  id: 944:0810
  serial_port: /dev/ttyUSB2
  serial_timeout: 270
  sampling_interval: 5
  reporting_interval: 60
  data_path: ae31
  staging_path: ae31
  remote_path: ae31
  # archive: archive/ae31

Aurora3000:
# NB: [serial_timeout] seconds
# NB: [sampling_interval] minutes
# NB: [reporting_interval] minutes
# NB: specify data, staging, archive relative to root
  serial_port: /dev/ttyUSB0
  serial_baudrate: 19200
  serial_timeout: 1
  sampling_interval: 1
  reporting_interval: 60
  data_path: aurora3000
  staging_path: aurora3000
  remote_path: aurora3000

AVO:
# NB: list deployments of AirVisual Outdoor unit or which data should be downloaded as url_{site}
# NB: specify data, staging, archive relative to root
# NB: [download_interval] minutes
  urls:
    url_mogogosiek: https://device.iqair.com/v2/64b78e3ed49ffdbbf25ce862
    url_nairobi: https://device.iqair.com/v2/64b79227b6f7b1125b019970
    url_bomet: https://device.iqair.com/v2/64ad7a78e939e8f45b826839
  data_path: avo
  staging_path: avo
  remote_path: avo
  download_interval: 360

49i:
# NB: [set avg time 3] must be compatible with lrec per
# NB: [set lrec per 1] must correspond to sampling_interval
# NB: [set lrec format 0] ASCII no labels
# NB: [serial_timeout] seconds
# NB: [sampling_interval] minutes. How often should data be requested from instrument?
# NB: [reporting_interval] minutes. How often should files be saved, staged and transfered?
# NB: specify data, staging, archive relative to root
  id: 49
  serial_number: 49I-B1NAA-12103910681
  socket:
    host: 192.168.2.14
    port: 9880
    timeout: 5
    sleep: 0.1
  get_config:
    - date
    - time
    - mode
    - gas unit
    - temp comp
    - pres comp
    - range
    - format
    - avg time
    - lrec per
    - lrec format
    - o3 coef
    - o3 bkg
  set_config:
    - set mode remote
    - set gas unit ppb
    - set temp comp on
    - set pres comp on
    - set range 1
    - set format 00
    - set avg time 1
    - set lrec per 1
    - set lrec format 0
    - set save params
  get_data: lr00
  sampling_interval: 1
  reporting_interval: 60
  data_path: 49i
  staging_path: 49i
  remote_path: 49i
  # archive: archive/49i

fidas:
  socket:
    host: 192.168.2.223   # Important: read README.md
    port: 56790
    buffer_size: 65535
    timeout: 0      # no longer used
    sleep: 0.005
  fetch_interval_seconds: 5
  reporting_interval: 60
  data_path: fidas
  staging_path: fidas
  remote_path: fidas

hmp110-inlet:
    type: Vaisala HMP110
    id: 1     # mainfold
    serial_number: U2110079  # aerosol inlet manyfold
    port: /dev/ttyUSB1
    data_header: dtm,T,RH,Td
    sampling_interval: 1        # minutes. How often should data be requested from instrument?
    reporting_interval: 60
    data_path: hmp110-inlet
    staging_path: hmp110-inlet
    staging_zip: True
    remote_path: hmp110-inlet

hmp110-ae31:
    type: Vaisala HMP110
    id: 2     # inlet AE31
    serial_number: M4730288  # inlet AE31
    port: /dev/ttyUSB1
    data_header: dtm,T,RH,Td
    sampling_interval: 1        # minutes. How often should data be requested from instrument?
    reporting_interval: 60
    data_path: hmp110-ae31
    staging_path: hmp110-ae31
    staging_zip: True
    remote_path: hmp110-ae31

hmp110-lab:
    type: Vaisala HMP110
    id: 3     # inlet AE31
    serial_number: U2110085  # inlet AE31
    port: /dev/ttyUSB1
    data_header: dtm,T,RH,Td
    sampling_interval: 1        # minutes. How often should data be requested from instrument?
    reporting_interval: 60
    data_path: hmp110-lab
    staging_path: hmp110-lab
    staging_zip: True
    remote_path: hmp110-lab

